name: Build dakota-lts

on:
  schedule:
    # Daily at 15:00 UTC — after Dakota's 13:00 UTC build finishes and
    # after AlmaLinux's nightly kernel updates land.
    - cron: '0 15 * * *'
  pull_request:
    branches: [main]
  merge_group:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE_REGISTRY: ghcr.io/${{ github.repository_owner }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.variant.name }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        variant:
          - name: dakota-lts
            containerfile: Containerfile
            tag: latest
            description: "GRUB + shim Secure Boot, fresh install"
          - name: dakota-lts
            containerfile: Containerfile.sdboot
            tag: sdboot
            description: "systemd-boot, bootc switch compatible, no SB enforcement"
          - name: dakota-lts
            containerfile: Containerfile.uki
            tag: uki
            description: "shim 16.1 → AlmaLinux signed UKI, no GRUB, full SB"
          - name: dakota-lts
            containerfile: Containerfile.nvidia
            tag: latest-nvidia
            description: "GRUB + shim Secure Boot + NVIDIA drivers"
          - name: dakota-lts
            containerfile: Containerfile.sdboot-nvidia
            tag: sdboot-nvidia
            description: "systemd-boot + NVIDIA drivers, bootc switch compatible"
          - name: dakota-lts
            containerfile: Containerfile.uki-nvidia
            tag: uki-nvidia
            description: "shim→UKI + NVIDIA drivers, full Secure Boot"
          - name: dakota-lts-installer
            containerfile: Containerfile.installer
            tag: latest
            description: "Minimal live installer image with fisherman + TUI"

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Capture build timestamp
        id: timestamp
        run: echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Detect AlmaLinux kernel version
        id: kver
        run: |
          KVER=$(podman run --rm quay.io/almalinuxorg/almalinux-bootc:10 \
            bash -c 'ls /usr/lib/modules | grep el10 | tail -1')
          echo "kver=${KVER}" >> "$GITHUB_OUTPUT"
          echo "Detected AlmaLinux kernel: ${KVER}"

      - name: Build image (${{ matrix.variant.tag }})
        env:
          CONTAINERFILE: ${{ matrix.variant.containerfile }}
          TAG: ${{ matrix.variant.tag }}
          KVER: ${{ steps.kver.outputs.kver }}
          TIMESTAMP: ${{ steps.timestamp.outputs.created }}
          DESCRIPTION: ${{ matrix.variant.description }}
          NAME: ${{ matrix.variant.name }}
        run: |
          podman build \
            --pull=newer \
            -f "${CONTAINERFILE}" \
            --label org.opencontainers.image.created="${TIMESTAMP}" \
            --label org.opencontainers.image.revision="${{ github.sha }}" \
            --label org.opencontainers.image.version="${KVER}" \
            --label org.opencontainers.image.description="${DESCRIPTION}" \
            --label org.projectbluefin.alma.kernel="${KVER}" \
            --label org.projectbluefin.alma.variant="${TAG}" \
            -t "${NAME}:${TAG}" \
            .

      - name: Validate with bootc container lint
        run: |
          podman run --rm --privileged \
            "${{ matrix.variant.name }}:${{ matrix.variant.tag }}" \
            bootc container lint

      - name: Login to GHCR
        if: >-
          github.event_name == 'merge_group' ||
          github.event_name == 'schedule'    ||
          github.event_name == 'workflow_dispatch'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | \
            podman login ghcr.io --username ${{ github.actor }} --password-stdin

      - name: Tag and push to GHCR
        id: push
        if: >-
          github.event_name == 'merge_group' ||
          github.event_name == 'schedule'    ||
          github.event_name == 'workflow_dispatch'
        run: |
          KVER="${{ steps.kver.outputs.kver }}"
          DATE="$(date -u +%Y%m%d)"
          TAG="${{ matrix.variant.tag }}"
          BASE="${{ env.IMAGE_REGISTRY }}/${{ matrix.variant.name }}"

          # Tag with variant suffix, kernel version, and date
          for tag in "${TAG}" "${TAG}-${KVER}" "${TAG}-${DATE}" "${TAG}-${{ github.sha }}"; do
            podman tag "${{ matrix.variant.name }}:${TAG}" "${BASE}:${tag}"
          done
          # :latest is an alias for the grub variant (most conservative/safe)
          if [ "${TAG}" = "latest" ]; then
            podman tag "${{ matrix.variant.name }}:${TAG}" "${BASE}:latest"
          fi

          for tag in "${TAG}" "${TAG}-${KVER}" "${TAG}-${DATE}" "${TAG}-${{ github.sha }}"; do
            for attempt in 1 2 3; do
              podman push --compression-format=zstd \
                "${BASE}:${tag}" && break
              echo "Push attempt ${attempt} failed for ${tag}, retrying..."
              sleep $((attempt * 5))
            done
          done

          DIGEST=$(skopeo inspect --raw "docker://${BASE}:${TAG}" \
            | python3 -c "import json,sys; d=json.load(sys.stdin); print(d['config']['digest'])" 2>/dev/null \
            || podman inspect "${BASE}:${TAG}" --format '{{.Digest}}' 2>/dev/null || true)
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"

      - name: Install cosign
        if: >-
          github.event_name == 'merge_group' ||
          github.event_name == 'schedule'    ||
          github.event_name == 'workflow_dispatch'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign image with cosign
        if: >-
          github.event_name == 'merge_group' ||
          github.event_name == 'schedule'    ||
          github.event_name == 'workflow_dispatch'
        env:
          COSIGN_EXPERIMENTAL: false
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
          COSIGN_PASSWORD: ""
          DIGEST: ${{ steps.push.outputs.digest }}
          TAG: ${{ matrix.variant.tag }}
          IMAGE_NAME: ${{ matrix.variant.name }}
        run: |
          for attempt in 1 2 3; do
            cosign sign -y \
              --new-bundle-format=false \
              --use-signing-config=false \
              --key env://COSIGN_PRIVATE_KEY \
              --registry-username ${{ github.actor }} \
              --registry-password ${{ secrets.GITHUB_TOKEN }} \
              "${IMAGE_REGISTRY}/${IMAGE_NAME}:${TAG}" && break
            echo "Cosign sign attempt ${attempt} failed, retrying..."
            sleep $((attempt * 5))
          done || echo "Warning: cosign signing failed (see issue #5 for tracking)"
